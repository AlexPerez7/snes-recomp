# A Link to the Past (USA), CRC32 777AAC2F
# See src/config.rs for the format.

[[entry]]
addr = "00:8000"
name = "reset"

[[entry]]
addr = "00:80C9"
name = "nmi_native"

[[entry]]
addr = "00:822C"
name = "nmi"

[[entry]]
addr = "00:82D8"
name = "irq"

# Hilo de la intro: el NMI y el IRQ de 00:82C7/00:831F cambian a el con una trama RTI que el juego
# prepara en la ROM (09:F818: P=30, PC=F81D, PBR=09), asi que ninguna llamada lo alcanza.
[[entry]]
addr = "09:F81D"
name = "intro_thread"

# Module dispatcher: LDY $10, then the target is built from three parallel
# byte arrays (low at $8061, high at $807D, bank at $8099) and taken with JML [$03].
[[table]]
kind = "split"
site = "00:80C6"
lo = "00:8061"
hi = "00:807D"
bank = "00:8099"
count = 28
name = "module_dispatch"

