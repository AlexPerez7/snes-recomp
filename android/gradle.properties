org.gradle.jvmargs=-Xmx2g
android.useAndroidX=false
# Fuentes hermanas de snes-recomp (clonadas/descomprimidas SIN configurar):
#   TinyCC, rama mob (se probó con e23dabe):  git clone https://github.com/TinyCC/tinycc.git ../../tinycc
#   SDL2 2.32.x:  https://github.com/libsdl-org/SDL/releases  ->  ../../SDL2-2.32.10
snesPort.tinyccDir=../../tinycc
snesPort.sdlDir=../../SDL2-2.32.10
# Perfil del juego (repositorio alttp-recomp, hermano de snes-recomp): el .toml y la carpeta de su C propio y traducción.
snesPort.gameProfile=../../alttp-recomp/games/alttp_usa.toml
# Identificador de la app en Android: el del juego, no el del motor. No se cambia después de repartir la primera versión.
snesPort.applicationId=io.github.alekaydevs.alttprecomp
# Aviso de versión nueva (opcional, apagado por defecto en la app): la API de la última release del repositorio del juego. Vacío: sin avisos.
snesPort.updateUrl=https://api.github.com/repos/AlekayDevs/alttp-recomp/releases/latest
