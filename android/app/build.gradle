// App Android de snes-port (cambio android-frontend). Ver android/README.md.
plugins {
    id 'com.android.application'
}

def repo = rootProject.file('..').canonicalPath
def tinycc = rootProject.file(providers.gradleProperty('snesPort.tinyccDir').get()).canonicalPath
def sdl = rootProject.file(providers.gradleProperty('snesPort.sdlDir').get()).canonicalPath
def profile = rootProject.file(providers.gradleProperty('snesPort.gameProfile').get())
def gameAssets = layout.buildDirectory.dir('generated/gameAssets')
// Nombre e icono propios del juego: games/<juego>/android/res (si existe) tapa los del motor (variantes antes que main).
def gameRes = new File(profile.parentFile, (profile.name - '.toml') + '/android/res')

android {
    namespace 'io.github.alexperez7.snesport'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        // La identidad de la app en Android (con la firma: lo que hace que una versión actualice a otra). Es del juego,
        // no del motor, y NO se puede cambiar una vez repartida una versión: ver gradle.properties.
        applicationId providers.gradleProperty('snesPort.applicationId').get()
        minSdk 29
        targetSdk 35
        versionCode 4
        // Dirección de la última release (API de GitHub) para el aviso de versión nueva; vacía: la app no tiene nada de eso.
        resValue 'string', 'app_id', providers.gradleProperty('snesPort.applicationId').get() // el atajo de los ajustes lo necesita (los recursos no admiten ${applicationId})
        resValue 'string', 'update_url', providers.gradleProperty('snesPort.updateUrl').getOrElse('')
        versionName '0.4'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DSNES_RECOMP_DIR=${repo}", "-DTINYCC_DIR=${tinycc}", "-DSDL2_DIR=${sdl}",
                        "-DSNES_GEN_LIB=${repo}/target/aarch64-linux-android/release/libsnes_recomp.a"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    // El análisis de lint de release baja sus herramientas de Internet; se desactiva para poder construir sin red.
    lint { checkReleaseBuilds false }
    // La firma de las versiones: la clave NO está en el repositorio. Va en ~/.gradle/gradle.properties:
    //   snesPort.keystore=/ruta/a/snes-port.jks  snesPort.keystorePassword=...  snesPort.keyAlias=...  snesPort.keyPassword=...
    // Sin ella, assembleRelease firma con la clave de depuración (solo para probar, no se reparte).
    def haveKey = providers.gradleProperty('snesPort.keystore').isPresent()
    signingConfigs {
        if (haveKey) {
            release {
                storeFile file(providers.gradleProperty('snesPort.keystore').get())
                storePassword providers.gradleProperty('snesPort.keystorePassword').get()
                keyAlias providers.gradleProperty('snesPort.keyAlias').get()
                keyPassword providers.gradleProperty('snesPort.keyPassword').get()
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (haveKey) signingConfig signingConfigs.release
            else {
                signingConfig signingConfigs.debug
                logger.warn('AVISO: sin snesPort.keystore, el APK de release va firmado con la clave de depuracion: no se reparte.')
            }
        }
    }
    // Las bibliotecas quedan como ficheros: libmain.so se enlaza contra libSDL2.so desde nativeLibraryDir.
    packaging { jniLibs { useLegacyPackaging true } }
    sourceSets {
        main {
            java.srcDirs += "${sdl}/android-project/app/src/main/java"
            assets.srcDirs += gameAssets.get().asFile
        }
        if (gameRes.isDirectory()) {
            debug.res.srcDirs += gameRes
            release.res.srcDirs += gameRes
        }
    }
}

// Cabeceras para TinyCC en el teléfono (las suyas, las mínimas propias y snes_rt.h) y el perfil con su C propio.
tasks.register('gameAssets', Sync) {
    into gameAssets
    from("${tinycc}/include") { into 'tcc_include' }
    from("${repo}/spikes/tcc_include") { into 'tcc_include' }
    from("${repo}/runtime") { include 'snes_rt.h'; into 'tcc_include' } // la interfaz del runtime: código propio
    from(profile) { into 'game'; rename { 'profile.toml' } }
    // Licencias de lo que lleva la app (LGPL 2.1: libtcc va como libtcc.so aparte y aqui se dice donde estan las fuentes).
    from("${rootProject.projectDir}/NOTICE.txt") { into 'licenses' }
    from("${tinycc}/COPYING") { into 'licenses'; rename { 'libtcc-LGPL-2.1.txt' } }
    from("${sdl}/LICENSE.txt") { into 'licenses'; rename { 'SDL2-zlib.txt' } }
    from(new File(profile.parentFile, profile.name - '.toml')) { into 'game/c'; exclude 'android/**' } // *.c y lang/
    doLast {
        // Android no lista carpetas de assets con rutas de ficheros: un índice para copiarlos.
        def root = gameAssets.get().asFile
        def lines = []
        root.eachFileRecurse { f -> if (f.isFile() && f.name != 'index.txt') lines << root.toPath().relativize(f.toPath()).toString() }
        new File(root, 'index.txt').text = lines.sort().join('\n') + '\n'
    }
}

// El generador (Rust) como biblioteca estática para arm64: no necesita el enlazador del NDK.
tasks.register('cargoGenerator', Exec) {
    workingDir repo
    commandLine 'cargo', 'rustc', '--release', '--lib', '--target', 'aarch64-linux-android', '--crate-type', 'staticlib'
}

tasks.named('preBuild') { dependsOn 'gameAssets', 'cargoGenerator' }
